# Compile dollwave.exe sur un Windows de GitHub.
# Un second job compile aussi sous Linux, pour vérifier que le lecteur
# reste facile à porter.
# Après le .exe, Inno Setup fabrique l'installateur
# (installateur/dollwave.iss).
# - À chaque pull request ou lancement manuel : le .exe et l'installateur
#   sont disponibles dans l'onglet « Actions » (rubrique « Artifacts »)
#   pour les tester.
# - Quand on pousse une étiquette de version (ex. v0.1.0) : les deux sont
#   en plus publiés sur une page « Release » du dépôt.
name: Compilation Windows

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Compilation du .exe
        run: cargo build --release

      # Inno Setup récent (6.6 ou plus) pour l'assistant sombre ; la
      # version vient de Cargo.toml.
      - name: Installateur
        run: |
          choco upgrade innosetup -y --no-progress
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" installateur\dollwave.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: dollwave
          path: |
            target/release/dollwave.exe
            target/installateur/dollwave-installation.exe

      - name: Publication de la Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" target/release/dollwave.exe target/installateur/dollwave-installation.exe --title "Doll//Wave ${{ github.ref_name }}" --generate-notes

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bibliothèque son de Linux, nécessaire à rodio.
      - name: Dépendances Linux
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test
