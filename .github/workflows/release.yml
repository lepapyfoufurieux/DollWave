# Compile dollwave.exe sur un Windows de GitHub, et la version Linux sur
# un Ubuntu.
# - Windows : après le .exe, Inno Setup fabrique l'installateur
#   (installateur/dollwave.iss).
# - Linux : le paquet .deb et l'AppImage (installateur/linux/fabriquer.sh).
#   Compilé sur Ubuntu 22.04 : le lecteur marche ainsi aussi sur les
#   distributions un peu anciennes.
# - À chaque pull request ou lancement manuel : tout est disponible dans
#   l'onglet « Actions » (rubrique « Artifacts ») pour le tester.
# - Quand on pousse une étiquette de version (ex. v1.1.0) : tout est en plus
#   publié sur une page « Release » du dépôt (dernier job).
name: Compilation Windows

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Compilation du .exe
        run: cargo build --release

      # Inno Setup récent (6.6 ou plus) pour l'assistant sombre ; la
      # version vient de Cargo.toml.
      - name: Installateur
        run: |
          choco upgrade innosetup -y --no-progress
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" installateur\dollwave.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: dollwave
          path: |
            target/release/dollwave.exe
            target/installateur/dollwave-installation.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Bibliothèque son de Linux, nécessaire à rodio.
      - name: Dépendances Linux
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Fabrique le .deb.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Tests
        run: cargo test --release

      - name: Compilation
        run: cargo build --release

      - name: Paquet .deb et AppImage
        run: installateur/linux/fabriquer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dollwave-linux
          path: |
            target/linux/*.deb
            target/linux/*.AppImage

  # Seulement quand on pousse une étiquette de version, une fois Windows et
  # Linux réussis : la page « Release » avec les quatre fichiers.
  publication:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: fichiers

      - name: Publication de la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          fichiers/dollwave/release/dollwave.exe
          fichiers/dollwave/installateur/dollwave-installation.exe
          fichiers/dollwave-linux/*.deb
          fichiers/dollwave-linux/*.AppImage
          --title "Doll//Wave ${{ github.ref_name }}" --generate-notes
