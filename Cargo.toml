[package]
name = "dollwave"
version = "0.1.0"
edition = "2021"

[dependencies]
# Interface graphique (fenêtre, boutons)
eframe = "0.29"
# Lecture audio (décodage MP3 + sortie son)
rodio = "0.19"
# Fenêtre native Windows « Ouvrir un fichier »
rfd = "0.15"
# Découpe le son en fréquences (graves → aigus) pour le visualiseur en barres
rustfft = "6.4"
# Décodage bloc par bloc pour le scratch (MP3, FLAC, WAV, OGG Vorbis), et
# lecture des tags (déjà utilisé par rodio en interne)
symphonia = { version = "0.5.5", default-features = false, features = [
    "mp3",
    "flac",
    "wav",
    "pcm",
    "ogg",
    "vorbis",
] }
# Décodage des pochettes d'album (JPEG, PNG). Déjà utilisé par eframe pour
# les icônes ; on lui ajoute juste la lecture des JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Trouve les dossiers du système (Musique, réglages) sous Windows comme
# sous Linux.
dirs = "6"
id3 = "1.17.2"
# Un seul lecteur ouvert : un deuxième lancement (double-clic sur un MP3)
# passe ses fichiers au premier, sous Windows comme sous Linux.
interprocess = "2.4"
# Bouton « Paroles » de la bibliothèque : on cherche les .lrc sur LRCLIB
# (site web), on lit ses réponses (format JSON) et on nettoie les titres
# (« (Official Video) », numéros de piste…) avec des expressions régulières.
ureq = "3.4.2"
serde_json = "1.0.154"
regex = "1.13.1"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }

# Seulement sous Windows (voir src/systeme/windows.rs).
[target.'cfg(windows)'.dependencies]
# L'icône du lecteur près de l'horloge, avec son menu.
tray-icon = "0.26"
# Accès direct à la fenêtre Windows (la retirer de la barre des tâches).
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Les bibliothèques (décodage MP3 notamment) sont optimisées même en mode
# développement : sinon le décodage serait très lent avec `cargo run`.
# Notre propre code reste en mode développement normal.
[profile.dev.package."*"]
opt-level = 3

# Outils utilisés seulement pendant la compilation (voir build.rs).
[build-dependencies]
# Range l'icône dans le .exe sous Windows.
winresource = "0.1"
