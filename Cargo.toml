[package]
name = "lecteur_mp3"
version = "0.1.0"
edition = "2021"

[dependencies]
# Interface graphique (fenêtre, boutons)
eframe = "0.29"
# Lecture audio (décodage MP3 + sortie son)
rodio = "0.19"
# Fenêtre native Windows « Ouvrir un fichier »
rfd = "0.15"
# Découpe le son en fréquences (graves → aigus) pour le visualiseur en barres
rustfft = "6.4"

# Les bibliothèques (décodage MP3 notamment) sont optimisées même en mode
# développement : sinon décoder un morceau entier avec `cargo run` prendrait
# plusieurs secondes. Notre propre code reste en mode développement normal.
[profile.dev.package."*"]
opt-level = 3
